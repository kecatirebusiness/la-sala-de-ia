<script>
// Links de creadores: lasaladeia.com/editor/<creador> → la página del editor con su referencia.
(function(){
  var m = location.pathname.match(/^\/editor\/([A-Za-z0-9_-]{2,40})\/?$/);
  var reservado = ['gracias', 'terminos', 'index', 'creadores'];
  if (m && reservado.indexOf(m[1].toLowerCase()) < 0) location.replace('/editor/?ref=' + encodeURIComponent(m[1].toLowerCase()));
})();
</script>
