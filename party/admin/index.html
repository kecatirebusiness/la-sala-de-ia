<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0B1D17">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RSVP Gen 01">
<title>RSVP Gen 01 · Dashboard</title>
<link rel="icon" href="../logo.png">
<link rel="apple-touch-icon" href="../logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{
    --emerald:#00D26A; --forest-deep:#0B1D17; --forest:#1A3A2A; --card:#12291F; --card-2:#173327;
    --sage:#7FB896; --mint:#C8E6D4; --snow:#F8FBF9; --muted:#6B7B73; --line:rgba(127,184,150,.18);
    --red:#FF6B6B; --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent }
  html{ background:var(--forest-deep) }
  body{ font-family:'Instrument Sans',system-ui,sans-serif; color:var(--snow); min-height:100dvh; -webkit-font-smoothing:antialiased;
    background:radial-gradient(120% 50% at 100% 0%, rgba(0,210,106,.22) 0%, transparent 60%), var(--forest-deep); background-attachment:fixed }
  i.s{ font-family:'Instrument Serif',serif; font-weight:400; color:var(--emerald) }
  .page{ max-width:520px; margin:0 auto; padding:calc(14px + var(--safe-t)) 16px calc(40px + var(--safe-b)) }
  button{ font-family:inherit; cursor:pointer }

  /* Header */
  .top{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:6px 0 18px }
  .brand{ display:flex; align-items:center; gap:10px }
  .brand svg{ width:32px; height:32px; flex-shrink:0 }
  .brand .t{ font-weight:700; font-size:16px; line-height:1.1 }
  .brand .t small{ display:block; font-weight:600; font-size:10px; letter-spacing:.22em; text-transform:uppercase; color:var(--sage); margin-top:3px }
  .iconbtn{ width:42px; height:42px; border-radius:12px; border:1px solid var(--line); background:var(--card); color:var(--mint); display:grid; place-items:center }
  .iconbtn svg{ width:19px; height:19px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round }
  .iconbtn.spin svg{ animation:sp .8s linear infinite }
  @keyframes sp{ to{ transform:rotate(360deg) } }

  /* KPIs */
  .hero{ border-radius:22px; padding:20px; background:linear-gradient(160deg, #0E3A26 0%, #10291F 60%); border:1px solid rgba(0,210,106,.25) }
  .hero .k{ font-size:10.5px; font-weight:700; letter-spacing:.26em; text-transform:uppercase; color:var(--sage) }
  .hero .big{ display:flex; align-items:baseline; gap:10px; margin-top:8px }
  .hero .big b{ font-family:'Instrument Serif',serif; font-style:italic; font-weight:400; font-size:76px; line-height:.9; color:var(--emerald); letter-spacing:-.02em }
  .hero .big span{ font-size:16px; font-weight:600; color:var(--mint) }
  .hero .meta{ margin-top:10px; font-size:13px; color:var(--sage) }
  .kpis{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px }
  .kpi{ border-radius:16px; padding:14px 16px; background:var(--card); border:1px solid var(--line) }
  .kpi b{ display:block; font-size:28px; font-weight:700; letter-spacing:-.02em }
  .kpi span{ font-size:12px; color:var(--sage); font-weight:500 }

  /* Search */
  .search{ position:relative; margin:18px 0 12px }
  .search input{ width:100%; height:48px; border-radius:14px; border:1px solid var(--line); background:var(--card); color:var(--snow); padding:0 14px 0 42px; font:500 16px 'Instrument Sans',sans-serif; outline:none }
  .search input:focus{ border-color:var(--emerald) }
  .search input::placeholder{ color:var(--muted) }
  .search svg{ position:absolute; left:14px; top:50%; transform:translateY(-50%); width:18px; height:18px; stroke:var(--muted); fill:none; stroke-width:2; stroke-linecap:round }
  .count{ font-size:12px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin:4px 2px 10px }

  /* List */
  .list{ display:flex; flex-direction:column; gap:10px }
  .item{ border-radius:18px; background:var(--card); border:1px solid var(--line); padding:14px 14px 12px; transition:opacity .25s, transform .25s }
  .item.gone{ opacity:0; transform:translateX(30px) }
  .row1{ display:flex; align-items:flex-start; gap:12px }
  .av{ width:42px; height:42px; border-radius:50%; background:rgba(0,210,106,.14); color:var(--emerald); display:grid; place-items:center; font-weight:700; font-size:15px; flex-shrink:0 }
  .who{ flex:1; min-width:0 }
  .who .n{ font-weight:700; font-size:16.5px; line-height:1.25; word-break:break-word }
  .who .plus{ display:inline-flex; align-items:center; gap:5px; margin-top:4px; padding:3px 9px; border-radius:999px; background:rgba(0,210,106,.12); color:var(--emerald); font-size:12px; font-weight:700 }
  .who .solo{ display:inline-block; margin-top:4px; font-size:12px; font-weight:600; color:var(--muted) }
  .who .e{ font-size:13px; color:var(--sage); margin-top:6px; word-break:break-all }
  .who .d{ font-size:11.5px; color:var(--muted); margin-top:2px }
  .actions{ display:flex; gap:8px; margin-top:12px }
  .act{ flex:1; height:40px; border-radius:11px; border:1px solid var(--line); background:var(--card-2); color:var(--mint); font-size:13.5px; font-weight:600; display:flex; align-items:center; justify-content:center; gap:6px; text-decoration:none }
  .act svg{ width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round }
  .act.del{ flex:0 0 44px; color:var(--red) }
  .confirm{ display:none; margin-top:12px; padding:12px; border-radius:12px; background:rgba(255,107,107,.08); border:1px solid rgba(255,107,107,.3) }
  .confirm.on{ display:block }
  .confirm p{ font-size:13.5px; color:#FFD3D3; line-height:1.4 }
  .confirm .b{ display:flex; gap:8px; margin-top:10px }
  .confirm button{ flex:1; height:40px; border-radius:10px; font-weight:700; font-size:14px; border:0 }
  .confirm .yes{ background:var(--red); color:#2A0B0B }
  .confirm .no{ background:transparent; border:1px solid var(--line); color:var(--mint) }

  .empty{ text-align:center; padding:40px 20px; color:var(--sage); font-size:15px; line-height:1.5; border:1px dashed var(--line); border-radius:18px }
  .empty b{ display:block; font-family:'Instrument Serif',serif; font-style:italic; font-weight:400; font-size:30px; color:var(--emerald); margin-bottom:6px }
  .updated{ text-align:center; font-size:12px; color:var(--muted); margin-top:20px }

  /* Login */
  .login{ min-height:80dvh; display:flex; flex-direction:column; justify-content:center }
  .login h1{ font-weight:700; font-size:34px; letter-spacing:-.03em; line-height:1.05; margin-top:26px }
  .login h1 i.s{ font-size:1.1em }
  .login p{ color:var(--mint); margin-top:10px; font-size:15px; line-height:1.5 }
  .login input{ margin-top:22px; width:100%; height:54px; border-radius:14px; border:1px solid var(--line); background:var(--card); color:var(--snow); padding:0 16px; font:500 17px 'Instrument Sans',sans-serif; outline:none }
  .login input:focus{ border-color:var(--emerald) }
  .btn{ margin-top:12px; width:100%; height:54px; border-radius:14px; border:0; background:var(--emerald); color:var(--forest-deep); font-weight:700; font-size:16px }
  .err{ color:var(--red); font-size:13.5px; margin-top:10px; min-height:18px }

  .toast{ position:fixed; left:50%; bottom:calc(20px + var(--safe-b)); transform:translateX(-50%) translateY(120px); background:var(--snow); color:var(--forest-deep); padding:12px 18px; border-radius:12px; font-weight:600; font-size:14px; transition:transform .3s; box-shadow:0 10px 30px rgba(0,0,0,.35); white-space:nowrap }
  .toast.on{ transform:translateX(-50%) translateY(0) }
  [hidden]{ display:none !important }
</style>
</head>
<body>
<main class="page">

  <!-- Login -->
  <section class="login" id="login" hidden>
    <div class="brand">
      <svg viewBox="0 0 80 80"><circle cx="40" cy="40" r="40" fill="#00D26A"/><circle cx="28.8" cy="35.2" r="4" fill="#0B1D17"/><circle cx="51.2" cy="35.2" r="4" fill="#0B1D17"/><line x1="30" y1="48.8" x2="50" y2="48.8" stroke="#0B1D17" stroke-width="3.2"/></svg>
      <div class="t">La Sala <i class="s">de IA</i><small>RSVP · Gen 01</small></div>
    </div>
    <h1>Dashboard de <i class="s">la fiesta</i></h1>
    <p>Escribe la clave de administrador. Este celular la recordará.</p>
    <form id="loginForm">
      <input id="keyInput" type="password" autocomplete="current-password" placeholder="Clave" autocapitalize="off" spellcheck="false">
      <button class="btn" type="submit" id="loginBtn">Entrar</button>
      <div class="err" id="loginErr"></div>
    </form>
  </section>

  <!-- Dashboard -->
  <section id="dash" hidden>
    <div class="top">
      <div class="brand">
        <svg viewBox="0 0 80 80"><circle cx="40" cy="40" r="40" fill="#00D26A"/><circle cx="28.8" cy="35.2" r="4" fill="#0B1D17"/><circle cx="51.2" cy="35.2" r="4" fill="#0B1D17"/><line x1="30" y1="48.8" x2="50" y2="48.8" stroke="#0B1D17" stroke-width="3.2"/></svg>
        <div class="t">Graduación <i class="s">Gen 01</i><small>Sáb 24 oct · 4:00 PM</small></div>
      </div>
      <div style="display:flex;gap:8px">
        <button class="iconbtn" id="refresh" aria-label="Actualizar"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
        <button class="iconbtn" id="logout" aria-label="Salir"><svg viewBox="0 0 24 24"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><path d="M10 17l-5-5 5-5M5 12h11"/></svg></button>
      </div>
    </div>

    <div class="hero">
      <div class="k">Van a ir</div>
      <div class="big"><b id="kTotal">–</b><span>personas</span></div>
      <div class="meta" id="kMeta">Cargando…</div>
    </div>
    <div class="kpis">
      <div class="kpi"><b id="kRsvp">–</b><span>Confirmaciones</span></div>
      <div class="kpi"><b id="kPlus">–</b><span>Llevan +1</span></div>
    </div>

    <div class="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Buscar por nombre, email o teléfono" autocomplete="off">
    </div>
    <div class="count" id="count"></div>
    <div class="list" id="list"></div>
    <div class="updated" id="updated"></div>
  </section>
</main>
<div class="toast" id="toast"></div>

<script>
  const ENDPOINT = 'https://script.google.com/macros/s/AKfycbxTPZ4MD3LOL1e8Q-unSnTukLipveOyp8h1ngZM7hvGqPf8Mo2b0cYfqK7b6EtuBoMnfQ/exec';
  const STORE = 'lsia-rsvp-admin-key';
  const $ = id => document.getElementById(id);
  let KEY = '', DATA = [], loading = false;

  const store = {
    get(){ try { return localStorage.getItem(STORE) || ''; } catch(e){ return ''; } },
    set(v){ try { localStorage.setItem(STORE, v); } catch(e){} },
    clear(){ try { localStorage.removeItem(STORE); } catch(e){} },
  };

  async function api(body){
    const r = await fetch(ENDPOINT, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ key: KEY }, body)) });
    return r.json();
  }

  function toast(msg){
    const t = $('toast'); t.textContent = msg; t.classList.add('on');
    clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), 2400);
  }

  function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function initials(n){ return String(n).trim().split(/\s+/).slice(0,2).map(w => w[0] || '').join('').toUpperCase(); }
  function when(iso){
    const d = new Date(iso); if (isNaN(d)) return '';
    return d.toLocaleDateString('es-PR', { day:'numeric', month:'short' }) + ' · ' + d.toLocaleTimeString('es-PR', { hour:'numeric', minute:'2-digit' });
  }
  function digits(t){ let d = String(t).replace(/\D/g,''); if (d.length === 10) d = '1' + d; return d; }

  function render(){
    const total = DATA.reduce((a, r) => a + r.personas, 0);
    const plus = DATA.filter(r => r.acompanante).length;
    $('kTotal').textContent = total;
    $('kRsvp').textContent = DATA.length;
    $('kPlus').textContent = plus;
    $('kMeta').textContent = DATA.length ? `${DATA.length} graduado${DATA.length === 1 ? '' : 's'} + ${plus} acompañante${plus === 1 ? '' : 's'}` : 'Todavía nadie ha confirmado';

    const q = $('q').value.trim().toLowerCase();
    const rows = q ? DATA.filter(r => [r.nombre, r.email, r.telefono, r.acompananteNombre].join(' ').toLowerCase().includes(q)) : DATA;
    $('count').textContent = q ? `${rows.length} resultado${rows.length === 1 ? '' : 's'}` : (DATA.length ? 'Más recientes primero' : '');

    if (!DATA.length) { $('list').innerHTML = '<div class="empty"><b>Aún nadie</b>Comparte lasaladeia.com/party y aquí verás a cada persona que confirme.</div>'; return; }
    if (!rows.length) { $('list').innerHTML = '<div class="empty">Nadie coincide con esa búsqueda.</div>'; return; }

    $('list').innerHTML = rows.map(r => {
      const i = DATA.indexOf(r), tel = digits(r.telefono);
      return `<div class="item" data-i="${i}">
        <div class="row1">
          <div class="av">${esc(initials(r.nombre))}</div>
          <div class="who">
            <div class="n">${esc(r.nombre)}</div>
            ${r.acompanante ? `<span class="plus">+1 · ${esc(r.acompananteNombre || 'sin nombre')}</span>` : `<span class="solo">Va solo/a</span>`}
            <div class="e">${esc(r.email)}</div>
            <div class="d">Confirmó ${esc(when(r.fecha))}</div>
          </div>
        </div>
        <div class="actions">
          <a class="act" href="tel:+${tel}"><svg viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>Llamar</a>
          <a class="act" href="https://wa.me/${tel}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M4 20l1.3-3.9A8 8 0 1 1 8 19z"/></svg>WhatsApp</a>
          <button class="act del" data-del="${i}" aria-label="Borrar"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg></button>
        </div>
        <div class="confirm" id="c${i}">
          <p>¿Borrar a <b>${esc(r.nombre)}</b>${r.acompanante ? ' y su +1' : ''} de la lista? No se puede deshacer.</p>
          <div class="b"><button class="no" data-no="${i}">Cancelar</button><button class="yes" data-yes="${i}">Sí, borrar</button></div>
        </div>
      </div>`;
    }).join('');
  }

  async function load(silent){
    if (loading) return; loading = true;
    $('refresh').classList.add('spin');
    try {
      const res = await api({ action:'list' });
      if (!res.ok) { if (res.error === 'clave') return logout('La clave cambió. Entra de nuevo.'); throw new Error(res.error); }
      DATA = res.lista; render();
      $('updated').textContent = 'Actualizado ' + new Date().toLocaleTimeString('es-PR', { hour:'numeric', minute:'2-digit' });
    } catch (e) {
      if (!silent) toast('No se pudo actualizar. Revisa tu conexión.');
    } finally { loading = false; $('refresh').classList.remove('spin'); }
  }

  $('list').addEventListener('click', async e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.del !== undefined) { document.querySelectorAll('.confirm.on').forEach(c => c.classList.remove('on')); $('c' + b.dataset.del).classList.add('on'); return; }
    if (b.dataset.no !== undefined) { $('c' + b.dataset.no).classList.remove('on'); return; }
    if (b.dataset.yes !== undefined) {
      const r = DATA[+b.dataset.yes]; b.disabled = true; b.textContent = 'Borrando…';
      try {
        const res = await api({ action:'delete', email: r.email });
        if (!res.ok) throw new Error(res.error);
        b.closest('.item').classList.add('gone');
        setTimeout(() => { DATA = res.lista; render(); }, 250);
        toast(`${r.nombre.split(' ')[0]} fue borrado/a de la lista`);
      } catch (err) { b.disabled = false; b.textContent = 'Sí, borrar'; toast('No se pudo borrar. Intenta de nuevo.'); }
    }
  });

  $('q').addEventListener('input', render);
  $('refresh').addEventListener('click', () => load());
  $('logout').addEventListener('click', () => logout());
  document.addEventListener('visibilitychange', () => { if (!document.hidden && KEY) load(true); });
  setInterval(() => { if (!document.hidden && KEY) load(true); }, 60000);

  function logout(msg){
    KEY = ''; store.clear(); DATA = [];
    $('dash').hidden = true; $('login').hidden = false;
    $('loginErr').textContent = msg || ''; $('keyInput').value = '';
  }

  $('loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const k = $('keyInput').value.trim(); if (!k) return;
    $('loginBtn').disabled = true; $('loginBtn').textContent = 'Entrando…'; $('loginErr').textContent = '';
    KEY = k;
    try {
      const res = await api({ action:'list' });
      if (!res.ok) { KEY = ''; $('loginErr').textContent = res.error === 'clave' ? 'Clave incorrecta.' : 'Algo falló. Intenta de nuevo.'; return; }
      store.set(k); DATA = res.lista;
      $('login').hidden = true; $('dash').hidden = false; render();
      $('updated').textContent = 'Actualizado ' + new Date().toLocaleTimeString('es-PR', { hour:'numeric', minute:'2-digit' });
    } catch (err) { KEY = ''; $('loginErr').textContent = 'Sin conexión. Intenta de nuevo.'; }
    finally { $('loginBtn').disabled = false; $('loginBtn').textContent = 'Entrar'; }
  });

  KEY = store.get();
  if (KEY) { $('dash').hidden = false; load(); } else { $('login').hidden = false; }
</script>
</body>
</html>
